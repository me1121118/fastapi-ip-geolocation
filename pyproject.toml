[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-ip-geolocation"
version = "0.1.0"
description = "FastAPI dependency to extract client IP and geolocation from Cloudflare, CloudFront, and proxy headers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "me1121118" }
]
keywords = ["fastapi", "python", "utility", "tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["fastapi>=0.100.0"]

[project.urls]
Homepage = "https://github.com/me1121118/fastapi-ip-geolocation"
Repository = "https://github.com/me1121118/fastapi-ip-geolocation"
